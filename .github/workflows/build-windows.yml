name: Build Windows x64 Desktop

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-win-x64:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Wine (for Windows packaging on Linux)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine-stable mono-devel

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: 'pnpm'

      - name: Bootstrap project
        run: pnpm bootstrap

      - name: Prepare desktop runtime assets
        run: pnpm prepare:desktop-runtime

      - name: Bundle Desktop (Windows x64)
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-win-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
          retention-days: 7
