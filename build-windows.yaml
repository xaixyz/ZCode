name: Build Windows x64 Desktop

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-win-x64:
    runs-on: windows-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # 未配置证书时跳过代码签名检测

    steps:
      - name: Enable Git Longpaths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: 'pnpm'

      - name: Install dependencies & Bootstrap
        run: |
          pnpm install --frozen-lockfile
          pnpm bootstrap

      - name: Prepare desktop runtime assets
        run: pnpm prepare:desktop-runtime

      - name: Bundle Desktop (Windows x64)
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-win-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
          retention-days: 7
